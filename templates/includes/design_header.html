{% load static %}
{% with nav=request.resolver_match.url_name ns=request.resolver_match.namespace path=request.path %}
<header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="max-w-7xl mx-auto px-margin h-20 flex items-center justify-between gap-space-md">

        <a href="/" class="flex items-center gap-space-xs shrink-0 group">
            <img alt="AAKAAR 19th Edition IIT Bombay" class="h-10 md:h-12 w-auto object-contain"
                 src="{% static 'img/aakaar_logo_ink.png' %}">
        </a>

        <nav class="hidden lg:flex items-center gap-space-md xl:gap-space-lg">
            <a class="font-body-sm text-body-sm transition-colors {% if path == '/' %}text-primary font-bold{% else %}text-on-surface-variant hover:text-on-surface{% endif %}"
               href="/">Home</a>
            <a class="font-body-sm text-body-sm transition-colors {% if ns == 'sympo' %}text-primary font-bold{% else %}text-on-surface-variant hover:text-on-surface{% endif %}"
               href="/sympo/">Symposium (ICES)</a>
            <a class="font-body-sm text-body-sm transition-colors {% if ns == 'compi' %}text-primary font-bold{% else %}text-on-surface-variant hover:text-on-surface{% endif %}"
               href="/compi/">Competitions</a>
            <a class="font-body-sm text-body-sm transition-colors {% if ns == 'events' and nav != 'workshop' %}text-primary font-bold{% else %}text-on-surface-variant hover:text-on-surface{% endif %}"
               href="/events/">Events</a>
        </nav>

        <div class="flex items-center gap-space-sm md:gap-space-md shrink-0">
            <a class="hidden sm:inline-flex items-center justify-center gap-space-xs bg-primary hover:bg-secondary-fixed hover:text-on-secondary-fixed-variant active:bg-secondary active:text-white text-on-primary px-space-lg py-2 rounded-full font-button-text text-button-text shadow-sm transition-all font-bold"
               href="https://crportal.aakaariitb.org.in/cr/" target="_blank" rel="noopener">
                <span>CR Portal</span>
                <span class="material-symbols-outlined text-[16px]">open_in_new</span>
            </a>

            <button type="button" aria-label="Open menu" aria-expanded="false" data-aa-menu-toggle
                    class="lg:hidden w-9 h-9 rounded-full bg-surface-container-high text-primary flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-[20px]">menu</span>
            </button>
        </div>
    </div>

    <div data-aa-menu-panel
         class="hidden lg:hidden border-t border-surface-container-highest bg-surface px-margin pb-space-lg pt-space-md">
        <nav class="flex flex-col">
            <a class="py-space-sm font-body-md text-body-md border-b border-surface-container-highest {% if path == '/' %}text-primary font-bold{% else %}text-on-surface-variant{% endif %}" href="/">Home</a>
            <a class="py-space-sm font-body-md text-body-md border-b border-surface-container-highest {% if ns == 'sympo' %}text-primary font-bold{% else %}text-on-surface-variant{% endif %}" href="/sympo/">Symposium (ICES)</a>
            <a class="py-space-sm font-body-md text-body-md border-b border-surface-container-highest {% if ns == 'compi' %}text-primary font-bold{% else %}text-on-surface-variant{% endif %}" href="/compi/">Competitions</a>
            <a class="py-space-sm font-body-md text-body-md {% if ns == 'events' and nav != 'workshop' %}text-primary font-bold{% else %}text-on-surface-variant{% endif %}" href="/events/">Events</a>
        </nav>
        <a class="mt-space-md inline-flex items-center justify-center gap-space-xs w-full bg-primary hover:bg-secondary-fixed hover:text-on-secondary-fixed-variant active:bg-secondary active:text-white text-on-primary px-space-lg py-space-sm rounded-full font-button-text text-button-text font-bold transition-all"
           href="https://crportal.aakaariitb.org.in/cr/" target="_blank" rel="noopener">
            <span>CR Portal</span>
            <span class="material-symbols-outlined text-[16px]">open_in_new</span>
        </a>
    </div>
</header>
{% endwith %}
