{% load static %}
{% comment %}
  Tectonic Terra design assets (vendored locally from the reference build).
{% endcomment %}
<!-- Preload primary font files for instant rendering without FOUT -->
<link rel="preload" href="{% static 'design/fonts/cc63ecbb63cc.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{% static 'design/fonts/a97232426709.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{% static 'design/fonts/0319ea60ff1a.woff2' %}" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="{% static 'design/fonts/fonts.css' %}">
<link rel="stylesheet" href="{% static 'design/fonts/material-symbols.css' %}">

<style>
  /* Critical typography: prevents any font-family flash or jump on page refresh */
  html, body, .font-body-md, .font-body-sm, .font-body-lg {
    font-family: 'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  }
  h1, h2, h3, h4, h5, h6, .font-display-hero, .font-headline-lg, .font-headline-md, .font-headline-sm, .font-button-text, .aa-hero-title, .aa-btn {
    font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  }
  .font-label-mono-xs, .font-label-mono-sm, .aa-hero-eyebrow, .aa-hero-note {
    font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    letter-spacing: 0.03em;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .aa-scroll-lock { overflow: hidden; }

  /* Global button interactive behavior requested by user:
     Bold colored by default, hover: light green (#c5eeb5 / #022101), clicked/active: normal green (#44673a / #ffffff) */
  .btn-primary,
  .aa-btn-primary,
  .aa-btn-ghost,
  .filter-btn,
  .compi-filter,
  button.bg-primary,
  a.bg-primary,
  a.font-button-text[class*="rounded-full"],
  button[class*="font-button-text"][class*="rounded-full"] {
    transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease !important;
  }
  .btn-primary:hover,
  .aa-btn-primary:hover,
  .aa-btn-ghost:hover,
  .filter-btn:hover,
  .compi-filter:hover,
  button.bg-primary:hover,
  a.bg-primary:hover,
  a.font-button-text[class*="rounded-full"]:hover,
  button[class*="font-button-text"][class*="rounded-full"]:hover {
    background-color: #c5eeb5 !important;
    color: #022101 !important;
    border-color: #c5eeb5 !important;
  }
  .btn-primary:active,
  .aa-btn-primary:active,
  .aa-btn-ghost:active,
  .filter-btn:active,
  .compi-filter:active,
  button.bg-primary:active,
  a.bg-primary:active,
  a.font-button-text[class*="rounded-full"]:active,
  button[class*="font-button-text"][class*="rounded-full"]:active {
    background-color: #44673a !important;
    color: #ffffff !important;
    border-color: #44673a !important;
  }
</style>

<script src="{% static 'design/tailwind.js' %}"></script>
{% if preflight == "off" %}
<script src="{% static 'design/tailwind-config-legacy.js' %}"></script>
{% else %}
<script src="{% static 'design/tailwind-config.js' %}"></script>
{% endif %}
